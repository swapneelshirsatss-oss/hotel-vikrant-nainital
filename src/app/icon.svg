<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Brown metallic linear gradient -->
    <linearGradient id="brownGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4513" />
      <stop offset="40%" stop-color="#CD853F" />
      <stop offset="60%" stop-color="#A0522D" />
      <stop offset="100%" stop-color="#5D4037" />
    </linearGradient>

    <!-- Bevel and drop shadow lighting filter -->
    <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.5" result="blur" />
      <feOffset dx="0.5" dy="0.5" result="offsetGlow" />
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.8" specularExponent="20" lighting-color="#D7CCC8" result="specOut">
        <fePointLight x="-50" y="-50" z="50" />
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litPaint" />
      <feDropShadow in="litPaint" dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.4" />
    </filter>

    <!-- Single petal geometry -->
    <g id="petal">
      <path d="M 100,15 A 50,50 0 0,1 100,100 A 50,50 0 0,1 100,15 Z" />
      <path d="M 100,55 A 27,27 0 0,1 100,100 A 27,27 0 0,1 100,55 Z" />
      <line x1="100" y1="15" x2="100" y2="55" />
    </g>
  </defs>

  <!-- Symmetrical 4-point assembly -->
  <g filter="url(#bevel)" fill="none" stroke="url(#brownGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <use href="#petal" />
    <use href="#petal" transform="rotate(90 100 100)" />
    <use href="#petal" transform="rotate(180 100 100)" />
    <use href="#petal" transform="rotate(270 100 100)" />
  </g>
</svg>
